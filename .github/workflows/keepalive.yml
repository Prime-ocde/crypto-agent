# 免费保活：定时访问 Streamlit Cloud 应用，避免免费实例因长时间无访问而休眠
# 不需要信用卡、不需要第三方账号；公共仓库的 Actions 额度是免费的。
# 注意：Actions 的 cron 最小粒度 5 分钟，且高峰期可能延迟 5–15 分钟，属于"够用"而不是"精确"。
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # 也可以在 Actions 页面手动点一次

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        env:
          APP_URL: https://crypto-agent-ac2s7gbjsf9iax8hyznvst.streamlit.app
        run: |
          set -eu
          # 带 cookie 连两次：第一次可能 303 去建立会话，第二次才是 200
          for attempt in 1 2; do
            code=$(curl -s -L --max-time 90 -c /tmp/cj.txt -b /tmp/cj.txt \
                   -o /dev/null -w "%{http_code}" "$APP_URL/" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            case "$code" in
              200|303) exit 0 ;;
            esac
            sleep 5
          done
          echo "应用不可达（最后一次 HTTP $code）"
          exit 1
