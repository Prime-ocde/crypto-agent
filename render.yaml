# Render.com 蓝图：一键部署 FastAPI 后端（免费套餐足够课堂演示）
# 用法：https://render.com/deploy?repo=https://github.com/Prime-ocde/crypto-agent
#      登录后点 Apply，会按本文件创建服务；部署完把服务地址填进
#      Streamlit Cloud 的 Secrets：BACKEND_BASE_URL = "https://xxx.onrender.com"
services:
  - type: web
    name: crypto-grid-quant-api
    runtime: python
    plan: free
    # 只装后端依赖：前端那套 Streamlit / Plotly / 图表包在云上纯属拖慢构建
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: RUN_MODE
        value: live
      - key: SYMBOLS
        value: BTCUSDT,ETHUSDT
      # 周期越多，WebSocket 订阅和内存越大；课堂演示这几个足够
      - key: INTERVALS
        value: 1m,5m,1h,1d,1w,1M
      - key: BINANCE_WS_URL
        value: wss://data-stream.binance.vision/ws
      - key: BINANCE_WS_FALLBACKS
        value: wss://stream.binance.com:9443/ws
      - key: BINANCE_REST_URL
        value: https://data-api.binance.vision
      - key: BINANCE_REST_FALLBACK
        value: https://api.binance.com
      - key: FEE_RATE
        value: "0.001"
      - key: WS_IDLE_TIMEOUT
        value: "30"
      # WS 断开时用 REST 补数据的间隔（秒）；0 = 关闭
      - key: REST_REFRESH_SECONDS
        value: "30"
      - key: PYTHON_VERSION
        value: "3.12.6"
